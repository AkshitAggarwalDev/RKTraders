# ===================================================================
# PostgreSQL profile (Supabase / production target)
# ===================================================================
# Activated with: --spring.profiles.active=postgres
# All values come from environment variables; no secrets in source.

# Local file: .env still works next to the JAR/workspace root
spring.config.import=optional:file:./.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:web}

# ===============================
# Database (PostgreSQL / Supabase)
# ===============================
# DB_VENDOR is optional; Hibernate auto-detects the dialect from the JDBC URL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Supabase: TLS is mandatory. The direct connection ends in "db.<ref>.supabase.co"
# on 5432, which validates a Supabase certificate.
# TLS is primarily controlled by sslmode in the JDBC URL (DB_URL); these driver
# properties act as a safety net if a URL is supplied without ssl params.
spring.datasource.hikari.data-source-properties.ssl=true
spring.datasource.hikari.data-source-properties.sslmode=require

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# Owner
# ===============================
owner.ownerName=${OWNER_NAME}
owner.ownerEmail=${OWNER_EMAIL}
owner.ownerPassword=${OWNER_PASSWORD}

# ===============================
# File Upload
# ===============================
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# Logging: keep credential-bearing datasource URLs out of logs.
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
